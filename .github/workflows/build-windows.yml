name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # necessário pra criar/anexar Release em tags v*

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.x'
          cache: true

      - name: Gera lib/config/keys.dart com secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path lib\config | Out-Null
          $url = $env:SUPABASE_URL.Trim()
          $anon = $env:SUPABASE_ANON_KEY.Trim()
          $service = $env:SUPABASE_SERVICE_KEY.Trim()
          $content = "// Gerado automaticamente pelo workflow - NAO commitar.`r`n" +
                     "class SupabaseKeys {`r`n" +
                     "  static const String supabaseUrl = '$url';`r`n" +
                     "  static const String supabaseAnonKey = '$anon';`r`n" +
                     "  static const String supabaseServiceKey = '$service';`r`n" +
                     "}`r`n"
          [System.IO.File]::WriteAllText("lib\config\keys.dart", $content, [System.Text.UTF8Encoding]::new($false))
          Write-Host "keys.dart gerado ($($content.Length) chars)"

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" LiturgiaBUDA_setup.iss

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: LiturgiaBUDA-Setup-${{ github.run_number }}
          path: installer\LiturgiaBUDA_setup.exe
          retention-days: 30

      - name: Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\LiturgiaBUDA_setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: LiturgiaBUDA-Windows-${{ github.run_number }}
          path: LiturgiaBUDA-Windows.zip
          retention-days: 30

      - name: Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiturgiaBUDA-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
