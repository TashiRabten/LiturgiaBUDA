name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

permissions:
  contents: write  # necessário pra criar/anexar Release em tags v*

jobs:
  build:
    runs-on: macos-14  # Apple Silicon, mas builda universal (Intel + ARM)
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pubspec requer Dart ^3.12 → Flutter ≥ 3.44
          flutter-version: '3.44.x'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Gera lib/config/keys.dart com secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p lib/config
          python3 <<'PYEOF'
          import os
          url = os.environ['SUPABASE_URL'].strip()
          anon = os.environ['SUPABASE_ANON_KEY'].strip()
          service = os.environ['SUPABASE_SERVICE_KEY'].strip()
          content = (
              "// Gerado automaticamente pelo workflow — NAO commitar.\n"
              "class SupabaseKeys {\n"
              f"  static const String supabaseUrl = '{url}';\n"
              f"  static const String supabaseAnonKey = '{anon}';\n"
              f"  static const String supabaseServiceKey = '{service}';\n"
              "}\n"
          )
          with open('lib/config/keys.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'keys.dart gerado ({len(content)} chars)')
          PYEOF

      - name: Pub get
        run: flutter pub get

      - name: Build macOS (Release, Universal)
        run: flutter build macos --release

      - name: Empacota como .pkg
        run: |
          APP_PATH="build/macos/Build/Products/Release/liturgiabuda.app"
          PKG_OUT="LiturgiaBUDA.pkg"

          # productbuild assina anonimamente — pra distribuir publicamente
          # você vai precisar configurar Developer ID (Apple Developer $99/ano).
          # Sem assinatura, usuário precisa abrir clicando-direito → Open.
          productbuild \
            --component "$APP_PATH" /Applications \
            --identifier org.pramana.liturgiabuda \
            --version "${GITHUB_REF_NAME}" \
            "$PKG_OUT"

          ls -lh "$PKG_OUT"

      - name: Upload artefato (test runs only — releases go to the GitHub Release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        continue-on-error: true   # account artifact storage may be full; don't fail a green build (test runs only)
        with:
          name: LiturgiaBUDA-macOS-${{ github.run_number }}
          path: LiturgiaBUDA.pkg
          retention-days: 1

      # Se for uma tag v*, anexa o .pkg na Release do GitHub
      - name: Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiturgiaBUDA.pkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
