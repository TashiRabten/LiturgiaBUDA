name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

jobs:
  build:
    runs-on: macos-14  # Apple Silicon, mas builda universal (Intel + ARM)
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'  # ajuste se precisar versão diferente
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build macOS (Release, Universal)
        run: flutter build macos --release

      - name: Empacota como .pkg
        run: |
          APP_PATH="build/macos/Build/Products/Release/liturgiabuda.app"
          PKG_OUT="LiturgiaBUDA.pkg"

          # productbuild assina anonimamente — pra distribuir publicamente
          # você vai precisar configurar Developer ID (Apple Developer $99/ano).
          # Sem assinatura, usuário precisa abrir clicando-direito → Open.
          productbuild \
            --component "$APP_PATH" /Applications \
            --identifier org.pramana.liturgiabuda \
            --version "${GITHUB_REF_NAME}" \
            "$PKG_OUT"

          ls -lh "$PKG_OUT"

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: LiturgiaBUDA-macOS-${{ github.run_number }}
          path: LiturgiaBUDA.pkg
          retention-days: 30

      # Se for uma tag v*, anexa o .pkg na Release do GitHub
      - name: Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiturgiaBUDA.pkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
