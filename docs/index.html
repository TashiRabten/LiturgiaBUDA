<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email confirmado — LiturgiaBUDA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #88A9CC 0%, #3E7EBE 100%);
      color: #2C3E50;
      padding: 20px;
    }
    .card {
      background: #F5EDD8;
      border: 3px solid #CC3300;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }
    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: #B8860B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
    }
    h1 {
      color: #CC3300;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #5A6080;
      margin-bottom: 12px;
    }
    strong { color: #B8860B; }
    .dharma {
      margin-top: 28px;
      font-size: 12px;
      color: #8B7355;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>EMAIL CONFIRMADO</h1>
    <p>Sua conta foi ativada com sucesso.</p>
    <p>Volte ao app <strong>LiturgiaBUDA</strong> e faça login com seu email e senha.</p>
    <div class="dharma">☸</div>
  </div>
</body>
</html>
