name: liturgiabuda
description: App de liturgia budista diária — LiturgiaBUDA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # Banco local
  sqflite: ^2.4.2
  path: ^1.9.0

  # Navegação
  go_router: ^15.1.2

  # Estado
  provider: ^6.1.2

  # Utilitários
  intl: ^0.20.2
  shared_preferences: ^2.5.3

  #File_Picker
  file_picker: ^8.1.2

  #sqLITE
  sqflite_common_ffi: ^2.3.0

  # Extração de PDF / DOCX
  archive: ^3.6.1            # unzip docx (pure Dart)
  xml: ^6.5.0                # parse word/document.xml
  syncfusion_flutter_pdf: ^33.2.7   # extração de texto PDF (community license: grátis pra indivíduos / orgs <$1M)

  # Render de HTML na tela de leitura (formato completo: bold, italic,
  # underline, strikethrough, listas com nível, alinhamento, headings)
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Gerador automático de ícones por plataforma a partir do BUDA.png
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Configuração do flutter_launcher_icons.
# Roda: flutter pub get && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/BUDA.png"
  macos:
    generate: true
    image_path: "assets/images/BUDA.png"
  windows:
    generate: true
    image_path: "assets/images/BUDA.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/BUDA.png"
    background_color: "#88A9CC"
    theme_color: "#CC3300"
  android:
    generate: false   # ative quando montar o build Android
  ios:
    generate: false   # ative quando montar o build iOS